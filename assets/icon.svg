<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Linstruct: a dark tile, a page of instructions whose lines are read in full down to
       a point — and cut there: the last lines are faded, the cut marked in orange. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d3440"/>
      <stop offset="1" stop-color="#1b2029"/>
    </linearGradient>
  </defs>
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bg)"/>
  <!-- the page -->
  <rect x="136" y="104" width="240" height="304" rx="24" fill="#f4f6f9"/>
  <!-- the lines read -->
  <g stroke="#2d3440" stroke-width="18" stroke-linecap="round">
    <line x1="176" y1="160" x2="300" y2="160"/>
    <line x1="176" y1="206" x2="336" y2="206"/>
    <line x1="176" y1="252" x2="316" y2="252"/>
  </g>
  <!-- the cut -->
  <line x1="152" y1="298" x2="360" y2="298" stroke="#eb6834" stroke-width="12" stroke-linecap="round" stroke-dasharray="26 18"/>
  <!-- the lines dropped -->
  <g stroke="#2d3440" stroke-opacity="0.22" stroke-width="18" stroke-linecap="round">
    <line x1="176" y1="344" x2="326" y2="344"/>
    <line x1="176" y1="384" x2="276" y2="384"/>
  </g>
  <!-- the eye of the linter: green, it sees -->
  <circle cx="356" cy="152" r="26" fill="#2fa32f"/>
</svg>
